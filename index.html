<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Bakerlab</title>
    <link
      rel="icon"
      type="image/svg"
      href="./src/images/icons/icon-cookie.svg"
    />
    <link
      rel="stylesheet"
      href="./src/styles/main.scss"
    />
    <script
      defer
      src="./src/scripts/main.js"
    ></script>
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <a
          href="#"
          class="header__logo logo"
        >
          <img
            class="logo__image"
            src="./src/images/logo-bakerlab.svg"
            alt="Bakerlab"
            width="136"
            height="32"
          />
        </a>
        <nav class="header__menu hidden-tablet-mobile">
          <ul class="header__menu-list">
            <li class="header__menu-item">
              <a
                href="#"
                class="header__menu-link"
              >
                Products
              </a>
            </li>
            <li class="header__menu-item">
              <a
                href="#"
                class="header__menu-link"
              >
                About Us
              </a>
            </li>
            <li class="header__menu-item">
              <a
                href="#"
                class="header__menu-link"
              >
                Blog
              </a>
            </li>
          </ul>
        </nav>
        <button
          class="header__button button button--contact-us hidden-tablet-mobile"
          type="button"
        >
          <span>Contact us</span>
        </button>
        <button
          class="header__burger-button icon icon--menu visible-tablet-mobile"
          type="button"
          aria-label="Open menu"
        >
        </button>
      </div>
    </header>
  </body>
</html>

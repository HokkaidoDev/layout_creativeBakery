<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Bakerlab</title>
    <link
      rel="icon"
      type="image/svg"
      href="./src/images/icons/icon-cookie.svg"
    />
    <link
      rel="stylesheet"
      href="./src/styles/main.scss"
    />
    <script
      defer
      src="./src/scripts/main.js"
    ></script>
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <a
          href="#"
          class="header__logo logo"
        >
          <img
            class="logo__image"
            src="./src/images/logo-bakerlab.svg"
            alt="Bakerlab logo"
            width="136"
            height="32"
          />
        </a>
        <nav class="nav header__menu hidden-tablet-mobile">
          <ul class="nav__list">
            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
              >
                Products
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
              >
                About Us
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
              >
                Blog
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#"
                class="nav__link button button--contact-us"
              >
                Contact us
              </a>
            </li>
          </ul>
        </nav>
        <a
          href="#menu"
          class="header__burger-button icon icon--menu visible-tablet-mobile"
          role="button"
          aria-controls="menu"
          aria-label="Open menu"
        ></a>
      </div>
    </header>

    <aside
      class="menu"
      id="menu"
    >
      <div class="menu__inner">
        <div class="menu__top">
          <a
            href="#"
            class="menu__logo logo"
          >
            <img
              class="logo__image"
              src="./src/images/logo-bakerlab.svg"
              alt="Bakerlab logo"
              width="136"
              height="32"
            />
          </a>
          <a
            href="#"
            class="menu__close-button icon icon--close visible-tablet-mobile"
            aria-label="Close menu"
          ></a>
        </div>

        <div class="menu__bottom">
          <nav class="nav nav--vertical visible-tablet-mobile">
            <ul class="nav__list">
              <li class="nav__item">
                <a
                  href="#"
                  class="nav__link"
                >
                  Products
                </a>
              </li>
              <li class="nav__item">
                <a
                  href="#"
                  class="nav__link"
                >
                  About Us
                </a>
              </li>
              <li class="nav__item">
                <a
                  href="#"
                  class="nav__link"
                >
                  Blog
                </a>
              </li>
              <li class="nav__item">
                <a
                  href="#"
                  class="nav__link button button--contact-us"
                >
                  Contact us
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </aside>
  </body>
</html>
